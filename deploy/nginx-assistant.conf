# Drop into the server { } block certbot created in
# /etc/nginx/sites-available/default (the 443 one), or include this file there.

location = /webhook {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8080;
}

# Privacy policy required to publish the Meta app.
location = /privacy {
    alias /var/www/assistant/privacy.html;
    default_type text/html;
}
